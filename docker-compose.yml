services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aureli
      POSTGRES_PASSWORD: aureli_local_only
      POSTGRES_DB: aureli
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aureli_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureli -d aureli"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aureli_data:
